# Replace paths with your own files.
orthophotos:
  - "data/7-123-10-13.tif"
buildings_vector: "data/budynki_bdot10k.gpkg"
buildings_layer: null
output_dir: "outputs/bdot_roofs"

# Raster bands are 1-based. Typical RGB GeoTIFF: [1, 2, 3].
bands: [1, 2, 3]
tile_size: 512
stride: 512
min_building_pixels: 12
# Erosion distance in map units. Requires a projected CRS whose units are metres.
# Start with 0.0; compare 0.25, 0.5, 1.0 m only after inspecting overlays.
mask_erosion_m: 0.0
all_touched: false

# Spatial split is assigned by source raster, not individual tile.
# Use separate geographically independent rasters for valid/test.
validation_fraction: 0.15
test_fraction: 0.15
random_seed: 42

training:
  epochs: 25
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  amp: true
  patience: 6
  threshold: 0.5
  encoder_name: "resnet34"
  encoder_weights: "imagenet"

prediction:
  threshold: 0.5
  batch_size: 16
  min_polygon_area_m2: 10.0
  simplify_tolerance_m: 0.5
